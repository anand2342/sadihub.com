server.port=8080

# Spring Application Name
spring.application.name=sadi-hub-backend

# H2 File Database (Persistent disk database for zero-config automation)
spring.datasource.url=jdbc:h2:file:./data/sadihubdb;AUTO_SERVER=TRUE
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# H2 Console (Access at http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# JPA / Hibernate configuration
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT Security Configuration
sadihub.jwt.secret=9a2f8c4e7b1d3a5f6e8c0b2d4e6f8a0c2b4d6e8f0a2c4b6e8f0a2c
sadihub.jwt.expiration=86400000
